<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232563eb' stroke='%231e40af' stroke-width='2'/%3E%3Cpath d='M50 10 Q70 25 75 45 Q75 65 50 80 Q25 65 25 45 Q30 25 50 10' fill='%2310b981' opacity='0.8'/%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%23dbeafe' stroke-width='1' opacity='0.5'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" media="screen and (min-width: 500px) and (min-height: 750px)" href="style/desktop.css">
    <link rel="stylesheet" media="screen and (max-aspect-ratio: 3/4)" href="style/mobile.css">

    <link rel="stylesheet" href="/shared/footer.css">
    <script type="module" src="game.js"></script>
</head>
<body>
    <div id="main-container">
        <div id="title-nav-container">
            <a id="nav-prev" class="nav-arrow nav-prev" href="#" aria-label="Previous game">
                <span class="nav-arrow-icon">‹</span>
                <span class="nav-label"></span>
            </a>
            <h1 id="game-title" style="font-family: 'Playfair Display', serif; text-align: center; font-size: 2.5rem; margin: 0; color: black; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">Capitale</h1>
            <a id="nav-next" class="nav-arrow nav-next" href="#" aria-label="Next game">
                <span class="nav-label"></span>
                <span class="nav-arrow-icon">›</span>
            </a>
        </div>
        <div id="header-container">
            <div class="header" id="header-hemisphere">
                <img src="/assets/images/categories-icons/hemisphere.png" alt="Hemisphere Icon" style="width:32px;height:32px;">
                <span>Hemisphere</span>
            </div>
            <div class="header" id="header-continent">
                <img src="/assets/images/categories-icons/continent.png" alt="Continent Icon" style="width:32px;height:32px;">
                <span>Continent</span>
            </div>
            <div class="header" id="header-population">
                <img src="/assets/images/categories-icons/population.png" alt="Population Icon" style="width:32px;height:32px;">
                <span>Population</span>
            </div>
            <div class="header" id="header-distance">
                <img src="/assets/images/categories-icons/distance.png" alt="Distance Icon" style="width:32px;height:32px;">
                <span>Distance</span>
            </div>
            <div class="header" id="header-direction">
                <img src="/assets/images/categories-icons/direction.png" alt="Direction Icon" style="width:32px;height:32px;">
                <span>Direction</span>
            </div>
        </div>
        
        <div id="guesses-container"></div>

        <div id="input-container">
            <div id="suggestions-container"></div>
            <input type="text" id="guess-input" placeholder="Guess here.." autocomplete="off">
            <button id="submit-button">Submit</button>
            <button id="hint-button">?</button>
            <button id="stats-button" aria-label="Show stats" title="Stats">📊</button>
        </div>
    </div>
    <footer class="site-footer">
        <a href="/privacy">Privacy</a>
        <a href="mailto:molnar.alex98@gmail.com">Email</a>
        <a href="https://github.com/alex-molnar/simple-daily-games" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="coffee-button" href="https://ko-fi.com/R5H524XXQ8" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>
            Buy me a coffee
        </a>
    </footer>
</body>
</html>
