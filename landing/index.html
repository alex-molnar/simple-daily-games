<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Games</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%234f46e5'/%3E%3Cpath d='M30 35h40v30H30z' fill='%23fff' rx='4'/%3E%3Ccircle cx='40' cy='50' r='6' fill='%234f46e5'/%3E%3Ccircle cx='60' cy='50' r='6' fill='%234f46e5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Games</h1>
            <p class="subtitle">Test your geography knowledge every day</p>
        </header>

        <main class="games-grid">
            <a href="https://capitale.kak.im" class="game-tile">
                <div class="tile-icon">🏛️</div>
                <h2>Capitale</h2>
                <p>Guess the capital city from geographic clues</p>
            </a>

            <a href="https://countryle.kak.im" class="game-tile">
                <div class="tile-icon">🌍</div>
                <h2>Countryle</h2>
                <p>Identify the country using hints</p>
            </a>

            <a href="https://grayscale.kak.im" class="game-tile">
                <div class="tile-icon">🏴</div>
                <h2>Grayscale</h2>
                <p>Name the country from its grayscale flag</p>
            </a>

            <a href="https://invertedle.kak.im" class="game-tile">
                <div class="tile-icon">🔄</div>
                <h2>Invertedle</h2>
                <p>Recognize the flag with inverted colors</p>
            </a>
        </main>
    </div>
</body>
</html>
