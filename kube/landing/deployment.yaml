apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: simple-daily-games
  labels:
    app: landing-page
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
      - name: landing-page
        image: kingbrady/simple-daily-games-landing-page:0.1.0
        ports:
        - containerPort: 80
