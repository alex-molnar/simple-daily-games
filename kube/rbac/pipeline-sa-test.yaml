# Lets the existing pipeline service account (in simple-daily-games) deploy to the
# test namespace too. Apply by hand as cluster admin, like pipeline-sa.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simple-daily-games-pipeline-sa-admin
  namespace: simple-daily-games-test
subjects:
  - kind: ServiceAccount
    name: simple-daily-games-pipeline-sa
    namespace: simple-daily-games
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# The built-in admin ClusterRole does not cover Traefik or Prometheus Operator CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simple-daily-games-pipeline-traefik
  namespace: simple-daily-games-test
rules:
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The ServiceMonitor that makes the Prometheus Operator scrape the API.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simple-daily-games-pipeline-traefik
  namespace: simple-daily-games-test
subjects:
  - kind: ServiceAccount
    name: simple-daily-games-pipeline-sa
    namespace: simple-daily-games
roleRef:
  kind: Role
  name: simple-daily-games-pipeline-traefik
  apiGroup: rbac.authorization.k8s.io
