apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Test environment: every branch except main deploys here, on test.<game>.kak.im.
namespace: simple-daily-games-test

resources:
  - ../base
  - ingress.yaml

patches:
  # Own database and origins, so test never writes to production stats.
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: POSTGRES_DB
                    value: simple-daily-games-test
                  - name: POSTGRES_USER
                    value: simple-daily-games-test
                  - name: CORS_ALLOW_ORIGINS
                    value: "https://test.capitale.kak.im,https://test.countryle.kak.im,https://test.grayscale.kak.im,https://test.invertedle.kak.im,https://test.geo-fun-factle.kak.im"

# Same images as production; the pipeline sets the tag at deploy time.
images:
  - name: kingbrady/simple-daily-games-static
    newTag: latest
  - name: kingbrady/simple-daily-games-api
    newTag: latest
