apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: simple-daily-games
  labels:
    app: api
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      volumes:
        - name: postgres-secret-volume
          secret:
            secretName: postgres-secret
      containers:
        - name: api
          image: kingbrady/simple-daily-games-api
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /readiness
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOSTNAME
              value: postgres.postgres.svc.cluster.local
            - name: CORS_ALLOW_ORIGINS
              value: "https://capitale.kak.im,https://countryle.kak.im,https://grayscale.kak.im,https://invertedle.kak.im"
            - name: CORS_ALLOW_CREDENTIALS
              value: "true"
            - name: CORS_ALLOW_METHODS
              value: "GET,POST"
            - name: CORS_ALLOW_HEADERS
              value: "*"


---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: simple-daily-games
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: api
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-ratelimit
  namespace: simple-daily-games
spec:
  # Per client IP. If Traefik sits behind another proxy, set sourceCriterion.ipStrategy
  # (depth or excludedIPs), otherwise every visitor shares one bucket.
  rateLimit:
    average: 20
    period: 1s
    burst: 40
