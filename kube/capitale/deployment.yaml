apiVersion: apps/v1
kind: Deployment
metadata:
  name: capitale
  namespace: simple-daily-games
  labels:
    app: capitale
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: capitale
  template:
    metadata:
      labels:
        app: capitale
    spec:
      containers:
      - name: capitale
        image: kingbrady/capitale:4.4.0
        ports:
        - containerPort: 80
