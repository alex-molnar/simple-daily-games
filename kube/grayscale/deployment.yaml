apiVersion: apps/v1
kind: Deployment
metadata:
  name: grayscale
  namespace: simple-daily-games
  labels:
    app: grayscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grayscale
  template:
    metadata:
      labels:
        app: grayscale
    spec:
      revisionHistoryLimit: 1
      containers:
      - name: grayscale
        image: kingbrady/grayscale:2.0.0
        ports:
        - containerPort: 80
