<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlagScale</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/shared/footer.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <div class="container">
    <!-- Title -->
    <div class="title-nav-container">
        <a id="nav-prev" class="nav-arrow nav-prev" href="#" aria-label="Previous game">
            <span class="nav-arrow-icon">‹</span>
            <span class="nav-label"></span>
        </a>
        <h1 class="game-title" id="game-title">FlagScale</h1>
        <a id="nav-next" class="nav-arrow nav-next" href="#" aria-label="Next game">
            <span class="nav-label"></span>
            <span class="nav-arrow-icon">›</span>
        </a>
    </div>
    
    <!-- Image placeholder -->
    <div class="image-container">
      <img id="flag-image" src="" alt="Flag">
    </div>

    <!-- Game description -->
    <p class="game-description" id="game-description"></p>

    <!-- Input and Guess button -->
    <div class="input-section">
      <input 
        type="text" 
        class="guess-input" 
        id="guess-input" 
        placeholder="Country..."
        autocomplete="off"
      >
      <button class="guess-button" id="submit-button">GUESS</button>
      <button class="guess-button stats-button" id="stats-button" aria-label="Show stats" title="Stats">📊</button>
      <div id="suggestions-container"></div>
    </div>

    <!-- 6 guess rows -->
    <div class="guesses-container" id="guesses-container">
        <div class="guess-row active" data-row="1">Guess 1 / 6</div>
        <div class="guess-row" data-row="2"></div>
        <div class="guess-row" data-row="3"></div>
        <div class="guess-row" data-row="4"></div>
        <div class="guess-row" data-row="5"></div>
        <div class="guess-row" data-row="6"></div>
    </div>
  </div>

  <!-- Guess feedback popup -->
  <div class="feedback-overlay" id="feedback-overlay">
    <div class="feedback-circle" id="feedback-circle">
      <img id="feedback-flag" src="" alt="Original Flag">
    </div>
  </div>
  <footer class="site-footer">
      <a href="/privacy">Privacy</a>
      <a href="mailto:molnar.alex98@gmail.com">Email</a>
      <a href="https://github.com/alex-molnar/simple-daily-games" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="coffee-button" href="https://ko-fi.com/R5H524XXQ8" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>
          Buy me a coffee
      </a>
  </footer>
</body>
</html>
