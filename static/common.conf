# Included by every server block: code and images shared by all the games.
location /shared/ {
    root /srv;
}

location /assets/ {
    root /srv;
    add_header Cache-Control "public, max-age=2592000";
}

# One privacy page, reachable as /privacy from every game and the landing page.
location = /privacy {
    default_type text/html;
    alias /srv/shared/privacy.html;
}
