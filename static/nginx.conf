gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# Hostnames end in .* so the same config also answers on capitale.localhost etc.
# The test. variants serve the test environment (test.capitale.kak.im).

server {
    listen 80 default_server;
    server_name capitale.* countryle.* test.capitale.* test.countryle.*;
    root /srv/country-games;
    include /etc/nginx/common.conf;
}

server {
    listen 80;
    server_name geo-fun-factle.* test.geo-fun-factle.*;
    root /srv/geo-fun-factle;
    include /etc/nginx/common.conf;
}

server {
    listen 80;
    server_name grayscale.* invertedle.* test.grayscale.* test.invertedle.*;
    root /srv/flag-games;
    include /etc/nginx/common.conf;
}

server {
    listen 80;
    server_name home.games.* test.home.games.*;
    root /srv/landing;
    include /etc/nginx/common.conf;
}
