name: Build and Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: kingbrady/simple-daily-games-landing-page

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat landing/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Landing page
        uses: docker/build-push-action@v6
        with:
          context: landing
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Landing Page deployment image tag
        run: |
          sed -i "s|image: kingbrady/simple-daily-games-landing-page:.*|image: kingbrady/simple-daily-games-landing-page:${{ steps.version.outputs.VERSION }}|" kube/landing/deployment.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kube/landing/deployment.yaml
          kubectl rollout status deployment/landing-page -n simple-daily-games --timeout=120s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
