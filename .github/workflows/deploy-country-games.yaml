name: Build and Deploy Country Games

on:
  push:
    branches: [main]
    paths:
      - 'country-games/**'
      - 'kube/capitale/**'
      - 'kube/countryle/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME_CAPITALE: kingbrady/capitale
  IMAGE_NAME_COUNTRYLE: kingbrady/countryle

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(cat country-games/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Capitale
        uses: docker/build-push-action@v6
        with:
          context: country-games
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME_CAPITALE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME_CAPITALE }}:latest
          build-args: |
            FLAVOUR=capitale
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update capitale deployment image tag
        run: |
          sed -i "s|image: kingbrady/capitale:.*|image: kingbrady/capitale:${{ steps.version.outputs.VERSION }}|" kube/capitale/deployment.yaml

      - name: Build and push Countryle
        uses: docker/build-push-action@v6
        with:
          context: country-games
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME_COUNTRYLE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME_COUNTRYLE }}:latest
          build-args: |
            FLAVOUR=countryle
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update countryle deployment image tag
        run: |
          sed -i "s|image: kingbrady/countryle:.*|image: kingbrady/countryle:${{ steps.version.outputs.VERSION }}|" kube/countryle/deployment.yaml

      - name: Commit deployment version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kube/capitale/deployment.yaml kube/countryle/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: update deployment images to v${{ steps.version.outputs.VERSION }} [skip ci]"
          git push

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kube/capitale/deployment.yaml
          kubectl rollout status deployment/capitale -n simple-daily-games --timeout=120s
          kubectl apply -f kube/countryle/deployment.yaml
          kubectl rollout status deployment/countryle -n simple-daily-games --timeout=120s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
