name: Build and Deploy (reusable)

# Called by deploy.yaml (main -> production) and deploy-test.yaml (other branches -> test).
on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      kustomize-dir:
        required: true
        type: string
      tag-latest:
        description: Also push the images as `latest`. Only production does, since
          `latest` is the fallback tag for anything not rebuilt in a run.
        required: true
        type: boolean

env:
  STATIC_IMAGE: kingbrady/simple-daily-games-static
  API_IMAGE: kingbrady/simple-daily-games-api
  NAMESPACE: ${{ inputs.namespace }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      static: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.static == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      kube: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.kube == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            static:
              - 'country-games/**'
              - 'flag-games/**'
              - 'landing/**'
              - 'shared/**'
              - 'assets/**'
              - 'static/**'
              - '.dockerignore'
            api:
              - 'api/**'
            kube:
              - 'kube/**'

  static:
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: static/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.STATIC_IMAGE }}:${{ github.sha }}
            ${{ inputs.tag-latest && format('{0}:latest', env.STATIC_IMAGE) || '' }}
          cache-from: type=gha,scope=static
          cache-to: type=gha,mode=max,scope=static

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ inputs.tag-latest && format('{0}:latest', env.API_IMAGE) || '' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: [changes, static, api]
    # Runs when something deployable changed and no build failed. A skipped build is fine.
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.static == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.kube == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        env:
          STATIC_BUILT: ${{ needs.static.result == 'success' }}
          API_BUILT: ${{ needs.api.result == 'success' }}
        run: |
          # An image built in this run deploys at the commit SHA. An image that was not
          # rebuilt keeps whatever tag is running now, so this apply never moves it.
          running_tag() {
            kubectl get deployment "$1" -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | cut -s -d: -f2
          }
          if [ "$STATIC_BUILT" = true ]; then STATIC_TAG=$GITHUB_SHA; else STATIC_TAG=$(running_tag static); fi
          if [ "$API_BUILT" = true ]; then API_TAG=$GITHUB_SHA; else API_TAG=$(running_tag api); fi

          cd "${{ inputs.kustomize-dir }}"
          kustomize edit set image \
            "$STATIC_IMAGE=$STATIC_IMAGE:${STATIC_TAG:-latest}" \
            "$API_IMAGE=$API_IMAGE:${API_TAG:-latest}"
          kubectl apply -k .
          kubectl rollout status deployment/static -n "$NAMESPACE" --timeout=120s
          kubectl rollout status deployment/api -n "$NAMESPACE" --timeout=120s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
